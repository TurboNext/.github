name: Test PyPI Publish (AR smoke test)

on:
  workflow_dispatch:
  push:
    branches:
      - artemk/reusable-ar-workflows

jobs:
  publish:
    uses: ./.github/workflows/reusable_pypi_publish.yml
    with:
      repository: pypi-tn
      working-directory: test/ar-smoke-test
      build-command: |
        sed -i "s/0\.0\.0/0.0.${{ github.run_number }}/" pyproject.toml
        python -m build
    secrets:
      PYPI_TN_PUBLISHER_KEY: ${{ secrets.PYPI_TN_PUBLISHER_KEY }}

  verify-read:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - id: ar-token
        uses: $/.github/actions/ar-python-token
        with:
          gcp-sa-key: ${{ secrets.PYPI_TN_READER_KEY }}
          repository: pypi-tn

      - name: Install the package just published, using the reader key
        run: |
          pip install --extra-index-url "${{ steps.ar-token.outputs.index-url }}" \
            "turbonext-ar-smoke-test==0.0.${{ github.run_number }}"
          python -c "import ar_smoke_test; print('pypi-tn reader auth + install OK')"
