name: 'AR Python Publish'
description: >-
  Mint a short-lived OAuth2 token for GCP Artifact Registry and
  twine-upload one or more dist globs.

inputs:
  gcp-sa-key:
    description: 'pypi-tn publisher service account JSON key.'
    required: true
  dist-glob:
    description: 'Glob (or space-separated globs) of files to upload.'
    required: false
    default: 'dist/*'
  repository:
    description: 'AR Python repository id.'
    required: false
    default: 'pypi-tn'
  project:
    description: 'GCP project hosting the AR repository.'
    required: false
    default: 'turbonext-first-project'
  location:
    description: 'GCP region hosting the AR repository.'
    required: false
    default: 'europe-west1'

runs:
  using: 'composite'
  steps:
    - name: Mint Artifact Registry publisher token
      id: token
      uses: TurboNext/.github/.github/actions/ar-python-token@main
      with:
        gcp-sa-key: ${{ inputs.gcp-sa-key }}
        repository: ${{ inputs.repository }}
        project: ${{ inputs.project }}
        location: ${{ inputs.location }}

    - name: Upload
      shell: bash
      run: |
        pip install --quiet twine
        twine upload \
          -u oauth2accesstoken \
          -p "${{ steps.token.outputs.token }}" \
          --repository-url "https://${{ inputs.location }}-python.pkg.dev/${{ inputs.project }}/${{ steps.token.outputs.repository }}/" \
          ${{ inputs.dist-glob }}
