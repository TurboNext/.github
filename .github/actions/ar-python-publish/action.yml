name: 'AR Python Publish'
description: >-
  Mint a short-lived OAuth2 token for GCP Artifact Registry and
  twine-upload one or more dist globs. Optionally also publishes the
  same dist to a second channel/repository (e.g. a CUDA-variant repo
  plus stable, when the build matches the configured default variant).

inputs:
  gcp-sa-key:
    description: 'pypi-tn publisher service account JSON key.'
    required: true
  dist-glob:
    description: 'Glob (or space-separated globs) of files to upload.'
    required: false
    default: 'dist/*'
  repository:
    description: >-
      AR Python repository id (pypi-tn, pypi-tn-cu129, pypi-tn-cu130).
      Ignored if channel is set.
    required: false
    default: 'pypi-tn'
  channel:
    description: >-
      Convenience alternative to repository: TurboNext's devpi-era channel
      name (cu129, cu130; anything else, including stable/simple/empty,
      resolves to pypi-tn). Takes precedence over repository when set.
    required: false
    default: ''
  also-repository:
    description: >-
      Optional second AR repository id to also publish dist-glob to (e.g.
      stable, alongside a CUDA-variant repository). Ignored if
      also-channel is set. Leave both also-* inputs empty to skip.
    required: false
    default: ''
  also-channel:
    description: 'Convenience alternative to also-repository.'
    required: false
    default: ''
  project:
    description: 'GCP project hosting the AR repository.'
    required: false
    default: 'turbonext-first-project'
  location:
    description: 'GCP region hosting the AR repository.'
    required: false
    default: 'europe-west1'

runs:
  using: 'composite'
  steps:
    # PENDING: TurboNext/.github#25 not yet merged to main, repoint at @main once it does
    - name: Mint Artifact Registry publisher token
      id: token
      uses: TurboNext/.github/.github/actions/ar-python-token@artemk/reusable-ar-workflows
      with:
        gcp-sa-key: ${{ inputs.gcp-sa-key }}
        repository: ${{ inputs.repository }}
        channel: ${{ inputs.channel }}
        project: ${{ inputs.project }}
        location: ${{ inputs.location }}

    - name: Upload
      shell: bash
      run: |
        pip install --quiet twine
        twine upload \
          -u oauth2accesstoken \
          -p "${{ steps.token.outputs.token }}" \
          --repository-url "https://${{ inputs.location }}-python.pkg.dev/${{ inputs.project }}/${{ steps.token.outputs.repository }}/" \
          ${{ inputs.dist-glob }}

    # PENDING: TurboNext/.github#25 not yet merged to main, repoint at @main once it does
    - name: Mint Artifact Registry publisher token (also-repository)
      id: also-token
      if: inputs.also-repository != '' || inputs.also-channel != ''
      uses: TurboNext/.github/.github/actions/ar-python-token@artemk/reusable-ar-workflows
      with:
        gcp-sa-key: ${{ inputs.gcp-sa-key }}
        repository: ${{ inputs.also-repository }}
        channel: ${{ inputs.also-channel }}
        project: ${{ inputs.project }}
        location: ${{ inputs.location }}

    - name: Upload (also-repository)
      shell: bash
      if: inputs.also-repository != '' || inputs.also-channel != ''
      run: |
        pip install --quiet twine
        twine upload \
          -u oauth2accesstoken \
          -p "${{ steps.also-token.outputs.token }}" \
          --repository-url "https://${{ inputs.location }}-python.pkg.dev/${{ inputs.project }}/${{ steps.also-token.outputs.repository }}/" \
          ${{ inputs.dist-glob }}
