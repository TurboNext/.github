name: 'AR Docker Login'
description: >-
  Authenticate Docker against a GCP Artifact Registry Docker repository
  using a service account key (publisher key to push, reader key to pull).

inputs:
  gcp-sa-key:
    description: 'AR publisher or reader service account JSON key.'
    required: true
  project:
    description: 'GCP project hosting the AR repository.'
    required: false
    default: 'turbonext-first-project'
  location:
    description: 'GCP region hosting the AR repository.'
    required: false
    default: 'europe-west1'

outputs:
  registry:
    description: 'Docker registry host that was authenticated, e.g. europe-west1-docker.pkg.dev.'
    value: ${{ steps.login.outputs.registry }}

runs:
  using: 'composite'
  steps:
    - uses: google-github-actions/setup-gcloud@v3.0.1

    - uses: google-github-actions/auth@v3.0.0
      with:
        credentials_json: ${{ inputs.gcp-sa-key }}

    - id: login
      shell: bash
      run: |
        REGISTRY="${{ inputs.location }}-docker.pkg.dev"
        gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${REGISTRY}"
        echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
